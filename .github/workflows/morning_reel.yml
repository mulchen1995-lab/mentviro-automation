name: mentviro Morning Reel (07:00 CET)

on:
  schedule:
    - cron: '0 5 * * *'   # 07:00 CET / 06:00 CEST
  workflow_dispatch:

jobs:
  reel:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Montserrat (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($w in @("Regular","Bold")) {
            $d = "C:\Windows\Fonts\Montserrat-$w.ttf"
            if (-not (Test-Path $d)) {
              Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-$w.ttf" -OutFile $d -UseBasicParsing
            }
          }

      - name: Install Montserrat (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-dejavu-core ffmpeg
          mkdir -p /usr/share/fonts/truetype
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Regular.ttf" -O /usr/share/fonts/truetype/Montserrat-Regular.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Bold.ttf" -O /usr/share/fonts/truetype/Montserrat-Bold.ttf
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Post reel
        env:
          RUN_MODE:             reel
          IG_USERNAME:          mentviro
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          IG_SESSION:           ${{ secrets.IG_SESSION }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/daily_post.py

      - name: Commit plan + dashboard
        shell: bash
        run: |
          git config user.name "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html || true
          git diff --cached --quiet || git commit -m "chore: reel $(date +%Y-%m-%d)"
          git push
