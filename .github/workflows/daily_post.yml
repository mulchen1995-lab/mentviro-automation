name: mentviro Daily Instagram Post

on:
  schedule:
    - cron: '0 16 * * *'   # 18:00 CET / 17:00 CEST
  workflow_dispatch:

jobs:
  post:
    # Self-hosted runner (home PC) → reels work (no IP block)
    # Falls back to ubuntu-latest if self-hosted is offline
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
        # On Windows self-hosted Python is already installed,
        # setup-python still works and pins the version.

      - name: Install Montserrat font (Linux CI only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-dejavu-core ffmpeg unzip
          mkdir -p /usr/share/fonts/truetype
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Regular.ttf" \
               -O /usr/share/fonts/truetype/Montserrat-Regular.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Bold.ttf" \
               -O /usr/share/fonts/truetype/Montserrat-Bold.ttf
          fc-cache -f

      - name: Install Montserrat font (Windows self-hosted only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $fonts = "C:\Windows\Fonts"
          foreach ($weight in @("Regular","Bold")) {
            $dest = "$fonts\Montserrat-$weight.ttf"
            if (-not (Test-Path $dest)) {
              Invoke-WebRequest -Uri "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-$weight.ttf" `
                -OutFile $dest -UseBasicParsing
              Write-Host "Installed Montserrat-$weight.ttf"
            } else {
              Write-Host "Montserrat-$weight.ttf already installed"
            }
          }

      - name: Install Python dependencies
        run: pip install -r automation/requirements.txt

      - name: Run daily post
        env:
          IG_USERNAME:          mentviro
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          IG_SESSION:           ${{ secrets.IG_SESSION }}
          MENTVIRO_LOGO_URL:    ${{ secrets.MENTVIRO_LOGO_URL }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/daily_post.py

      - name: Commit updated plan + dashboard
        shell: bash
        run: |
          git config user.name  "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html || true
          git diff --cached --quiet || git commit -m "chore: update plan + dashboard $(date +%Y-%m-%d)"
          git push
