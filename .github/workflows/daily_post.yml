name: mentviro Daily Instagram Post

on:
  schedule:
    - cron: '0 16 * * *'   # 18:00 Uhr Berlin (CEST = UTC+2)
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fonts
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Run daily post
        env:
          COMPOSIO_API_KEY:   ${{ secrets.COMPOSIO_API_KEY }}
          MENTVIRO_LOGO_URL:  ${{ secrets.MENTVIRO_LOGO_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python automation/daily_post.py

      - name: Commit updated plan
        run: |
          git config user.name  "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json
          git diff --cached --quiet || git commit -m "chore: mark $(date +%Y-%m-%d) as published"
          git push
