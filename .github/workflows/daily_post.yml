name: mentviro Evening Carousel (self-hosted, manuell)

# Zeitplan deaktiviert: Carousels laufen jetzt cloud-first über "mentviro Cloud Poster"
# (PC-unabhängig). Dieser self-hosted Job ist nur noch für manuelle Läufe vom PC aus.
on:
  workflow_dispatch:

jobs:
  carousel:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Montserrat (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          foreach ($w in @("Regular","Bold")) {
            $d = "C:\Windows\Fonts\Montserrat-$w.ttf"
            if (-not (Test-Path $d)) {
              try {
                Invoke-WebRequest "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-$w.ttf" -OutFile $d -UseBasicParsing -ErrorAction Stop
              } catch {
                try {
                  Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-$w.ttf" -OutFile $d -UseBasicParsing -ErrorAction Stop
                } catch {
                  Write-Host "Montserrat-$w download failed — will use system font"
                }
              }
            }
          }

      - name: Install Montserrat (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-dejavu-core ffmpeg libwebp7
          mkdir -p /usr/share/fonts/truetype
          for weight in Regular Bold; do
            DEST="/usr/share/fonts/truetype/Montserrat-${weight}.ttf"
            curl -fsSL "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-${weight}.ttf" \
              -o "$DEST" || \
            curl -fsSL -H "Accept: application/octet-stream" \
              "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-${weight}.ttf" \
              -o "$DEST" || true
            if [ -f "$DEST" ]; then
              HEAD=$(head -c 4 "$DEST" | xxd -p 2>/dev/null || true)
              if [ "$HEAD" != "00010000" ] && [ "${HEAD:0:8}" != "74727565" ]; then
                echo "Montserrat-${weight}.ttf invalid, removing"; rm -f "$DEST"
              fi
            fi
          done
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Post carousel
        env:
          RUN_MODE:                    carousel
          IG_USER_ID:                  ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:             ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME:       ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET:    ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          MENTVIRO_LOGO_URL:           ${{ secrets.MENTVIRO_LOGO_URL }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKGROUND_MUSIC_URL:        ${{ secrets.BACKGROUND_MUSIC_URL }}
        run: python automation/daily_post.py

      - name: Commit plan + dashboard
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          git config user.name "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html 2>$null; $true
          $today = Get-Date -Format "yyyy-MM-dd"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "chore: carousel $today" }
          git pull --rebase
          git push
