name: mentviro Evening Carousel (18:00 CET)

on:
  schedule:
    - cron: '0 16 * * *'   # 18:00 CET / 17:00 CEST
  workflow_dispatch:

jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get install -y fonts-dejavu-core ffmpeg
          mkdir -p /usr/share/fonts/truetype
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Regular.ttf" -O /usr/share/fonts/truetype/Montserrat-Regular.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Bold.ttf" -O /usr/share/fonts/truetype/Montserrat-Bold.ttf
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Post carousel
        env:
          RUN_MODE:             carousel
          IG_USERNAME:          mentviro
          IG_PASSWORD:          ${{ secrets.IG_PASSWORD }}
          IG_SESSION:           ${{ secrets.IG_SESSION }}
          MENTVIRO_LOGO_URL:    ${{ secrets.MENTVIRO_LOGO_URL }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:       ${{ secrets.PEXELS_API_KEY }}
          ELEVENLABS_API_KEY:   ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/daily_post.py

      - name: Commit plan + dashboard
        shell: bash
        run: |
          git config user.name "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html || true
          git diff --cached --quiet || git commit -m "chore: carousel $(date +%Y-%m-%d)"
          git push
