name: mentviro Midday Stories (12:00 CET)

on:
  schedule:
    - cron: '0 10 * * *'   # 12:00 CET / 11:00 CEST
  workflow_dispatch:

jobs:
  stories:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Montserrat (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          foreach ($w in @("Regular","Bold")) {
            $d = "C:\Windows\Fonts\Montserrat-$w.ttf"
            if (-not (Test-Path $d)) {
              Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-$w.ttf" -OutFile $d -UseBasicParsing
            }
          }

      - name: Install Montserrat (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p /usr/share/fonts/truetype
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Regular.ttf" -O /usr/share/fonts/truetype/Montserrat-Regular.ttf
          wget -q "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Bold.ttf" -O /usr/share/fonts/truetype/Montserrat-Bold.ttf
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Post daily stories
        env:
          RUN_MODE:                    stories
          IG_USER_ID:                  ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:             ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME:       ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET:    ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/daily_post.py

      - name: Commit plan + dashboard
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          git config user.name "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html 2>$null; $true
          $today = Get-Date -Format "yyyy-MM-dd"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "chore: stories $today" }
          git pull --rebase
          git push
