name: mentviro Midday Stories (12:00 CET)

on:
  schedule:
    - cron: '0 10 * * *'   # 12:00 CET / 11:00 CEST
  workflow_dispatch:

jobs:
  stories:
    runs-on: self-hosted
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Montserrat (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          foreach ($w in @("Regular","Bold")) {
            $d = "C:\Windows\Fonts\Montserrat-$w.ttf"
            if (-not (Test-Path $d)) {
              try {
                Invoke-WebRequest "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-$w.ttf" -OutFile $d -UseBasicParsing -ErrorAction Stop
              } catch {
                try {
                  Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-$w.ttf" -OutFile $d -UseBasicParsing -ErrorAction Stop
                } catch {
                  Write-Host "Montserrat-$w download failed - will use system font"
                }
              }
            }
          }

      - name: Install Montserrat (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p /usr/share/fonts/truetype
          for weight in Regular Bold; do
            DEST="/usr/share/fonts/truetype/Montserrat-${weight}.ttf"
            curl -fsSL "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-${weight}.ttf" -o "$DEST" || \
            curl -fsSL "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-${weight}.ttf" -o "$DEST" || true
          done
          fc-cache -f

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Post daily stories
        env:
          RUN_MODE:                    stories
          IG_USER_ID:                  ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:             ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME:       ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET:    ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python automation/daily_post.py

      - name: Commit plan + dashboard
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          git config user.name "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html 2>$null; $true
          $today = Get-Date -Format "yyyy-MM-dd"
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: stories $today"
            # Robust push: the published-status MUST land in the repo, otherwise the
            # cloud fallback sees the story as still pending 2h later and re-posts it
            # (duplicate stories). Retry fetch+merge (prefer our plan on conflict)+push.
            $pushed = $false
            for ($i = 1; $i -le 6; $i++) {
              git fetch origin main
              git merge -X ours --no-edit origin/main
              git push
              if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
              Start-Sleep -Seconds 4
            }
            if (-not $pushed) { Write-Host "::warning::Push of published status FAILED after 6 tries — fallback may duplicate" }
          }
