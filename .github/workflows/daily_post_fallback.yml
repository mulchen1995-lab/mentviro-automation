name: mentviro Cloud Poster (primär)

# PRIMÄRE Postingquelle — läuft cloud-seitig (ubuntu-latest), unabhängig davon ob
# Julians PC an ist. Jeder Modus hat zwei Cron-Zeiten (primär + Retry), weil GitHub
# geplante Crons gern droppt/verzögert. Der "already posted"-Check + zeitbasierte
# Guards verhindern Doppel-Posts beim Retry.

on:
  schedule:
    - cron: '0 16 * * *'   # 18:00 CET — carousel
    - cron: '0 18 * * *'   # 20:00 CET — carousel (Retry)
  workflow_dispatch:
    inputs:
      mode:
        description: 'reel | stories | carousel'
        required: true
        default: 'carousel'

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Determine mode from schedule
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            # Delay-tolerant windows: GitHub often fires crons up to ~1h late, which
            # broke the old exact-hour mapping (a late 10:00 cron ran at 13:00 and
            # posted carousel instead of stories). Wide windows map the right mode.
            HOUR=$((10#$(date -u +%H)))
            if   [ "$HOUR" -ge 5 ]  && [ "$HOUR" -le 9 ];  then MODE="reel"
            elif [ "$HOUR" -ge 10 ] && [ "$HOUR" -le 15 ]; then MODE="stories"
            else MODE="carousel"
            fi
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Running cloud post: $MODE"

      - name: Check if already posted today
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          MODE="${{ steps.mode.outputs.mode }}"
          STATUS=$(python3 -c "
          import json, sys
          plan = json.load(open('automation/content_plan.json'))
          today = '$TODAY'
          mode  = '$MODE'
          if mode == 'stories':
              for s in plan.get('story_queue', []):
                  if s['date'] == today and s['status'] == 'published':
                      print('published'); sys.exit(0)
          else:
              for p in plan['posts']:
                  if p['date'] == today and p.get('type') == mode and p['status'] == 'published':
                      print('published'); sys.exit(0)
          print('pending')
          ")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "Today $TODAY [$MODE]: $STATUS"

      - name: Skip — already posted
        if: steps.check.outputs.status == 'published'
        run: echo "Self-hosted runner already posted. Fallback not needed."

      - name: Setup environment
        if: steps.check.outputs.status == 'pending'
        continue-on-error: true
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core ffmpeg libwebp7
          mkdir -p /usr/share/fonts/truetype
          # Download Montserrat — try JSDelivr CDN (reliable), fallback to raw GitHub
          for weight in Regular Bold; do
            DEST="/usr/share/fonts/truetype/Montserrat-${weight}.ttf"
            curl -fsSL "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/montserrat/static/Montserrat-${weight}.ttf" \
              -o "$DEST" || \
            curl -fsSL -H "Accept: application/octet-stream" \
              "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-${weight}.ttf" \
              -o "$DEST" || true
            # Remove file if it's not a valid TTF (first byte 0x00 or 't')
            if [ -f "$DEST" ]; then
              HEAD=$(head -c 4 "$DEST" | xxd -p 2>/dev/null || true)
              if [ "$HEAD" != "00010000" ] && [ "${HEAD:0:8}" != "74727565" ]; then
                echo "Montserrat-${weight}.ttf download invalid (head=$HEAD), removing"
                rm -f "$DEST"
              else
                echo "Montserrat-${weight}.ttf OK"
              fi
            fi
          done
          fc-cache -f || true

      - uses: actions/setup-python@v5
        if: steps.check.outputs.status == 'pending'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.status == 'pending'
        run: pip install -r automation/requirements.txt

      - name: Run fallback post
        if: steps.check.outputs.status == 'pending'
        env:
          RUN_MODE:                    ${{ steps.mode.outputs.mode }}
          IG_USER_ID:                  ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:             ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME:       ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET:    ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          MENTVIRO_LOGO_URL:           ${{ secrets.MENTVIRO_LOGO_URL }}
          GEMINI_API_KEY:              ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:              ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKGROUND_MUSIC_URL:        ${{ secrets.BACKGROUND_MUSIC_URL }}
        run: python automation/daily_post.py

      - name: Commit
        if: steps.check.outputs.status == 'pending'
        run: |
          git config user.name "mentviro-bot"
          git config user.email "bot@mentviro.com"
          git add automation/content_plan.json docs/index.html || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: fallback ${{ steps.mode.outputs.mode }} $(date +%Y-%m-%d)"
            # Robust push: published status MUST persist, else the next run re-posts.
            pushed=0
            for i in $(seq 1 6); do
              git fetch origin main
              git merge -X ours --no-edit origin/main || true
              if git push; then pushed=1; break; fi
              sleep 4
            done
            [ "$pushed" = "1" ] || echo "::warning::Push of published status FAILED after 6 tries"
          fi
